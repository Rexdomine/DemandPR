name: Vercel Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demandpr-production
  cancel-in-progress: true

jobs:
  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_M5iRNyEcNZHaREmgnyWgJgI1
      VERCEL_PROJECT_ID: prj_HggbtLdbdaJcuvDu89kGscjs5AlT
      DEMANDPR_VERCEL_TOKEN: ${{ secrets.DEMANDPR_VERCEL_TOKEN }}
    steps:
      - name: Check out exact merged main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact clean source identity
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production candidate
        run: |
          npm run audit:security
          npm run verify:checkpoint

      - name: Pull dedicated Demand PR production settings
        run: >-
          npx --yes vercel@55.0.0 pull
          --yes
          --environment=production
          --scope demandprltd-8340s-projects
          --token "$DEMANDPR_VERCEL_TOKEN"

      - name: Verify dedicated Vercel project link
        run: |
          node - <<'NODE'
          const project = require("./.vercel/project.json");
          if (
            project.projectId !== process.env.VERCEL_PROJECT_ID ||
            project.orgId !== process.env.VERCEL_ORG_ID
          ) {
            throw new Error("Refusing to deploy outside the dedicated Demand PR Vercel project");
          }
          NODE

      - name: Build exact production artifact
        run: npx --yes vercel@55.0.0 build --prod --token "$DEMANDPR_VERCEL_TOKEN"

      - name: Refuse a superseded main commit
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Remove Git author metadata from the prebuilt runner artifact
        run: |
          rm -rf .git
          test ! -e .git

      - name: Deploy and promote exact artifact to production
        id: deploy
        run: |
          url="$(npx --yes vercel@55.0.0 deploy \
            --prebuilt \
            --prod \
            --yes \
            --scope demandprltd-8340s-projects \
            --token "$DEMANDPR_VERCEL_TOKEN")"
          case "$url" in
            https://demandpr-*.vercel.app) ;;
            *) echo "Unexpected deployment URL: $url" >&2; exit 1 ;;
          esac
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '## Demand PR production deployment\n\nCommit: `%s`\n\nDeployment: %s\n' \
            "$GITHUB_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify stable production alias and non-indexing guard
        run: |
          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            if curl --fail --silent --show-error \
              --dump-header "$headers" \
              --output /dev/null \
              https://demandpr.vercel.app/ &&
              grep -iq '^x-robots-tag:.*noindex' "$headers"; then
              rm -f "$headers"
              exit 0
            fi
            rm -f "$headers"
            if [ "$attempt" -eq 6 ]; then
              echo "Stable production alias did not become healthy and non-indexable" >&2
              exit 1
            fi
            sleep 10
          done
