name: Vercel Production Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: demandpr-production-recovery-pr36
  cancel-in-progress: false

jobs:
  deploy-approved-main:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/production-recovery-pr36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN_SHA: 1239747e37e96b7c834fc3b3cdf4e2aca04a926d
      VERCEL_ORG_ID: team_M5iRNyEcNZHaREmgnyWgJgI1
      VERCEL_PROJECT_ID: prj_HggbtLdbdaJcuvDu89kGscjs5AlT
      DEMANDPR_VERCEL_TOKEN: ${{ secrets.DEMANDPR_VERCEL_TOKEN }}
    steps:
      - name: Refuse a changed production baseline
        env:
          LIVE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: test "$LIVE_BASE_SHA" = "$EXPECTED_MAIN_SHA"

      - name: Check out exact approved merged main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}

      - name: Verify exact clean source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Pull dedicated Demand PR production settings
        run: >-
          npx --yes vercel@55.0.0 pull
          --yes
          --environment=production
          --scope demandprltd-8340s-projects
          --token "$DEMANDPR_VERCEL_TOKEN"

      - name: Verify dedicated Vercel project link
        run: |
          node - <<'NODE'
          const project = require("./.vercel/project.json");
          if (
            project.projectId !== process.env.VERCEL_PROJECT_ID ||
            project.orgId !== process.env.VERCEL_ORG_ID
          ) {
            throw new Error("Refusing to deploy outside the dedicated Demand PR Vercel project");
          }
          NODE

      - name: Build exact production artifact
        run: npx --yes vercel@55.0.0 build --prod --token "$DEMANDPR_VERCEL_TOKEN"

      - name: Remove Git author metadata from the prebuilt runner artifact
        run: |
          rm -rf .git
          test ! -e .git

      - name: Deploy and promote exact artifact to production
        id: deploy
        run: |
          url="$(npx --yes vercel@55.0.0 deploy \
            --prebuilt \
            --prod \
            --yes \
            --scope demandprltd-8340s-projects \
            --token "$DEMANDPR_VERCEL_TOKEN")"
          case "$url" in
            https://demandpr-*.vercel.app) ;;
            *) echo "Unexpected deployment URL: $url" >&2; exit 1 ;;
          esac
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '## Demand PR production recovery\n\nCommit: `%s`\n\nDeployment: %s\n' \
            "$EXPECTED_MAIN_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"
